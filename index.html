<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DACHACLUB / 認可コード受け取り</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F4F1EC; --ink:#26221E; --brand:#3E3833; --muted:#6E6660; --line:#DCD6CE; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Noto Sans JP",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;line-height:1.7;
  }
  .box{
    background:#fff;border-radius:18px;padding:38px 34px;
    max-width:680px;width:100%;
    box-shadow:0 3px 20px rgba(0,0,0,.08);
  }
  h1{font-size:23px;font-weight:900;margin-bottom:6px;letter-spacing:.02em;}
  .lead{font-size:15px;color:var(--muted);font-weight:700;margin-bottom:26px;}
  .label{font-size:14px;font-weight:900;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;}
  code{
    display:block;background:#F2EFEA;border:2px solid var(--line);
    border-radius:10px;padding:16px 18px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:14px;word-break:break-all;line-height:1.6;
    max-height:220px;overflow:auto;
  }
  button{
    margin-top:14px;width:100%;
    background:var(--brand);color:#fff;border:none;border-radius:10px;
    padding:14px;font-size:16px;font-weight:900;cursor:pointer;
    font-family:inherit;
  }
  button:hover{opacity:.88;}
  .ok{color:#2E6B3E;font-weight:900;font-size:14px;margin-top:10px;min-height:20px;}
  .none{font-size:15px;font-weight:700;color:var(--muted);}
  .note{
    margin-top:26px;padding-top:20px;border-top:2px solid var(--line);
    font-size:13px;color:var(--muted);font-weight:700;
  }
  .warn{color:#8C3A1E;}
</style>
</head>
<body>
<div class="box">
  <h1>DACHACLUB / 認可コード受け取り</h1>
  <div class="lead">Instagram の認可後に戻ってくるページです。</div>
  <div id="out"></div>
  <div class="note">
    このページは <b>OAuth のリダイレクト先</b>として使うためだけのものです。<br>
    画像は <code style="display:inline;padding:2px 6px;border:none;background:#F2EFEA;">/posts/</code> に置かれます。<br>
    <span class="warn">⚠️ 表示されたコードは、チャットや Slack に貼らないでください。</span>
  </div>
</div>

<script>
  var code  = new URLSearchParams(location.search).get("code");
  var error = new URLSearchParams(location.search).get("error_description");
  var out   = document.getElementById("out");

  if (code) {
    out.innerHTML =
      '<div class="label">認可コード</div>' +
      '<code id="c"></code>' +
      '<button id="b">コピーする</button>' +
      '<div class="ok" id="m"></div>';
    document.getElementById("c").textContent = code;
    document.getElementById("b").onclick = function () {
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById("m").textContent = "コピーしました。setup_token.py に貼り付けてください。";
      });
    };
  } else if (error) {
    out.innerHTML = '<div class="label">エラー</div><code id="e"></code>';
    document.getElementById("e").textContent = error;
  } else {
    out.innerHTML = '<div class="none">認可コードはありません。<br>' +
      'Instagram の認可画面から「許可」を押すと、ここにコードが表示されます。</div>';
  }
</script>
</body>
</html>
